version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dol-postgres
    environment:
      POSTGRES_DB: dol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - dol_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/DOL.Identity.API/Dockerfile
    container_name: dol-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=dol;Username=postgres;Password=postgrespassword
      - Jwt__SecretKey=SUPER_SECRET_KEY_FOR_DOL_PLATFORM_IDENTITY_SERVICE_NET10!
      - Jwt__Issuer=DOL.Identity
      - Jwt__Audience=DOL.Platform
    ports:
      - "5065:80"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: src/DOL.Gateway/Dockerfile
    container_name: dol-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-service__Address=http://identity-api:80/
    ports:
      - "5000:80"
    depends_on:
      - identity-api

volumes:
  dol_postgres_data:
